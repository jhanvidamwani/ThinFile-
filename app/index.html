<title>ThinFile</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: paperwork. Cool paper desk, white statement sheets, ledger figures in mono, one cobalt accent.
   Status colors (good/warn/bad) are semantic only. */
:root{
  --desk:#eef0ee; --sheet:#ffffff; --ink:#121a2b; --muted:#5c6577; --rule:#d6dbe0; --faint:#eef1f4;
  --accent:#2743d6; --accent-soft:#e3e8fd;
  --good:#0d8458; --good-soft:#dcf2e8; --warn:#a96f0f; --warn-soft:#f8ecd2; --bad:#bf3626; --bad-soft:#f8dfdb;
  --shadow:0 1px 0 rgba(18,26,43,.04),0 12px 32px -14px rgba(18,26,43,.22);
  --sans:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0b0f17; --sheet:#141a25; --ink:#e8ecf3; --muted:#97a1b3; --rule:#283142; --faint:#1b2230;
  --accent:#8195ff; --accent-soft:#1f2747;
  --good:#3ccf8e; --good-soft:#123326; --warn:#e9b24c; --warn-soft:#352a12; --bad:#ff7a66; --bad-soft:#3a1c18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0b0f17; --sheet:#141a25; --ink:#e8ecf3; --muted:#97a1b3; --rule:#283142; --faint:#1b2230;
  --accent:#8195ff; --accent-soft:#1f2747;
  --good:#3ccf8e; --good-soft:#123326; --warn:#e9b24c; --warn-soft:#352a12; --bad:#ff7a66; --bad-soft:#3a1c18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(2.6rem,8vw,4.6rem);line-height:.95;font-weight:900}
h2{font-size:clamp(1.4rem,4vw,1.85rem);font-weight:800;line-height:1.1}
h3{font-size:1.05rem;font-weight:800}
p{margin:0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.label{font-size:.82rem;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem;letter-spacing:-.02em}
.logo svg{width:26px;height:22px}
.bar .label a{color:inherit}

/* buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:11px 18px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.link{all:unset;cursor:pointer;color:var(--muted);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.link:hover{color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding-block:24px 8px}
.hero>*,.check>*,.plan>*,.files>*,section{min-width:0}
@media (max-width:620px){.bar .label{display:none}}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:30em;margin-top:18px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hero h1 em{font-style:normal;color:var(--accent)}
.demo{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;transform:rotate(1.2deg)}
.demo .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:10px}
.demo .count{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.demo .count b{color:var(--good);font-weight:600}
@media (max-width:760px){.hero{grid-template-columns:1fr}.demo{transform:none}}

/* folder-tab cards */
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-top:14px}
@media (max-width:760px){.files{grid-template-columns:1fr}}
.file{all:unset;box-sizing:border-box;cursor:pointer;position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:0 10px 10px 10px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.file::before{content:attr(data-tab);position:absolute;left:-1px;top:-24px;height:24px;padding:3px 14px 0;background:var(--sheet);border:1px solid var(--rule);border-bottom:none;border-radius:8px 8px 0 0;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--muted)}
.file:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.file:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.file .who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.file .who b{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.file p{color:var(--muted);font-size:.95rem}
.file .open{font-family:var(--mono);font-size:.75rem;color:var(--accent);margin-top:2px}
.pill{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* how it works */
.how{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.how div{padding:16px 14px 16px 0;display:flex;flex-direction:column;gap:4px}
.how div+div{padding-left:14px;border-left:1px solid var(--rule)}
.how b{font-size:.98rem}
.how span{color:var(--muted);font-size:.86rem;line-height:1.4}
@media (max-width:760px){.how{grid-template-columns:1fr}.how div+div{border-left:none;border-top:1px solid var(--rule);padding-left:0}}

/* sheets */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0;position:relative}
@media (max-width:520px){.sheet{padding:18px}}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.sheet-head .label b{color:var(--ink);font-weight:600}
textarea,input[type=text]{font:inherit;width:100%;border:1px solid var(--rule);border-radius:8px;padding:12px;background:var(--desk);color:var(--ink)}
textarea{font-family:var(--mono);font-size:.78rem;min-height:140px;resize:vertical}
.err{color:var(--bad);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* checking */
.check{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}
@media (max-width:760px){.check{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);opacity:.4;transition:opacity .35s}
.steps li:last-child{border-bottom:none}
.steps li.run,.steps li.on{opacity:1}
.steps .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-family:var(--mono);font-size:.78rem;transition:background .3s,border-color .3s,color .3s}
.steps li.run .n{border-color:var(--accent);color:var(--accent);animation:ring 1.1s infinite}
.steps li.on .n{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
@keyframes ring{50%{box-shadow:0 0 0 5px var(--accent-soft)}}
.steps .t{display:flex;gap:8px;align-items:center;font-weight:700}
.steps small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.kind{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--faint);color:var(--muted)}
.kind.ai{background:var(--accent-soft);color:var(--accent)}
.tape{background:var(--desk);border-radius:8px;padding:10px;height:380px;overflow:hidden;position:relative;font-family:var(--mono);font-size:.74rem;mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent)}
.tape-in{display:flex;flex-direction:column;gap:4px}
.tx{display:grid;grid-template-columns:76px 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;background:var(--sheet);animation:slide .35s cubic-bezier(.2,.8,.2,1) both}
.tx .d{color:var(--muted)}.tx .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx .a{text-align:right}
.tx .c{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:var(--faint);color:var(--muted);min-width:64px;text-align:center;transition:background .3s,color .3s}
.tx .c.set{background:var(--accent-soft);color:var(--accent)}
.tx .c.rent,.tx .c.bill,.tx .c.debt{background:var(--good-soft);color:var(--good)}
.tx .c.fee{background:var(--bad-soft);color:var(--bad)}
.tx .s.hid{color:var(--accent)}
@keyframes slide{from{opacity:0;transform:translateY(14px)}}
@media (max-width:520px){.tx{grid-template-columns:1fr auto auto}.tx .d{display:none}}

/* report */
.sheet-head .label b{white-space:nowrap}

.wallbox{overflow-x:auto;padding:4px 2px 6px}
.wall{display:grid;gap:6px 0}
.wall .r{display:grid;align-items:center}
.wall .lbl{font-size:.84rem;font-weight:600;white-space:nowrap;padding-right:12px}
.wall .m{font-family:var(--mono);font-size:.6rem;line-height:1.25;color:var(--muted);text-align:center;white-space:nowrap}
.strip{display:flex;flex-direction:column;gap:6px}
.strip>div{display:flex;gap:5px;flex-wrap:wrap}
.strip .dot{width:13px;height:13px;margin:0;cursor:inherit}
.dot{all:unset;display:block;box-sizing:border-box;width:18px;height:18px;border-radius:50%;margin:auto;cursor:pointer;background:var(--faint);transform:scale(.2);opacity:0;animation:pop .32s cubic-bezier(.3,1.5,.5,1) forwards;transition:box-shadow .15s}
.dot:hover,.dot:focus-visible{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--ink);outline:none}
.dot.g{background:var(--good)}.dot.y{background:var(--warn)}.dot.r{background:var(--bad)}
.dot.none{background:transparent;border:1px dashed var(--rule);cursor:default;width:16px;height:16px}
@keyframes pop{to{transform:scale(1);opacity:1}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);align-items:center}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.legend .tipnote{margin-left:auto;font-family:var(--mono);font-size:.72rem}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--sheet);padding:9px 12px;border-radius:8px;font-size:.82rem;line-height:1.35;max-width:240px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.show{opacity:1;transform:none}
#tip b{display:block}
#tip .mono{font-size:.76rem;opacity:.85}

.figs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule)}
.figs div{padding:12px 12px 0 0;display:flex;flex-direction:column}
.figs div+div{padding-left:12px;border-left:1px solid var(--rule)}
.figs strong{font-family:var(--mono);font-size:clamp(1.3rem,4.5vw,1.9rem);font-weight:600;font-variant-numeric:tabular-nums}
.figs span{color:var(--muted);font-size:.82rem}
@media (max-width:560px){.figs{grid-template-columns:1fr 1fr}.figs div:nth-child(3){border-left:none;padding-left:0}}
.summary{font-size:1.15rem;font-weight:500;line-height:1.45;max-width:40em}
.byline{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;display:block}

.plan{border-top:2px solid var(--ink);padding-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:700px){.plan{grid-template-columns:1fr}}
.plan ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.plan li b{font-family:var(--mono);font-weight:600;white-space:nowrap}
.whatif{background:var(--desk);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.whatif .res{display:flex;align-items:center;justify-content:space-between;gap:10px}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.88rem}
.slider output{font-family:var(--mono);font-weight:600}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--accent)}

.twins{display:flex;flex-direction:column}
.twin{display:grid;grid-template-columns:1.4fr auto auto auto;gap:14px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:center;animation:slide .3s both}
.twin .id{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.twin .s{font-family:var(--mono);font-weight:600}
@media (max-width:520px){.twin{grid-template-columns:1fr auto auto}.twin .id{display:none}}
.verdict-line{padding:12px 14px;border-radius:8px;font-weight:700;display:flex;gap:10px;align-items:center}
.verdict-line.good{background:var(--good-soft);color:var(--good)}.verdict-line.warn{background:var(--warn-soft);color:var(--warn)}
.verdict-line svg{width:20px;height:20px;flex:none}

details summary{cursor:pointer;font-weight:800;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:var(--mono);font-size:1.3rem;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details[open] summary{margin-bottom:14px}
.tbl{overflow:auto;border:1px solid var(--rule);border-radius:6px;max-height:300px}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
th{position:sticky;top:0;background:var(--sheet);font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.amt{text-align:right;font-family:var(--mono)}
.by{font-family:var(--mono);font-size:.65rem;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--faint);color:var(--muted)}
.by.ai{background:var(--accent-soft);color:var(--accent)}
.cashbox{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.cashbox.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.notes{background:var(--desk);border-radius:8px;padding:14px 16px}
.notes ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.connect{max-width:520px;margin:0 auto;width:100%}
.perm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.93rem}
.perm li{display:flex;gap:10px;align-items:flex-start}
.perm svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--good)}
.acct{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;transition:border-color .15s,background .15s}
.acct:hover{border-color:var(--ink)}
.acct[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.acct:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acct .bank{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.acct small{display:block;color:var(--muted);font-family:var(--mono);font-size:.75rem}
.demo-flag{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:4px;align-self:flex-start}
.progress{height:4px;background:var(--faint);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width 1.4s cubic-bezier(.4,0,.2,1)}
.shared{position:absolute;top:-12px;left:20px;background:var(--accent);color:#fff;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:4px}
.foot{color:var(--muted);font-size:.8rem;text-align:center;font-family:var(--mono)}


.demo-g{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.demo-g .gauge.small{max-width:150px}
.fscore{font-weight:800;font-size:1.6rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fscore.good{color:var(--good)}.fscore.warn{color:var(--warn)}.fscore.bad{color:var(--bad)}
/* score dial */
.scorecard{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:28px;align-items:center}
@media (max-width:680px){.scorecard{grid-template-columns:1fr;justify-items:center;text-align:center}.scorecard .bands{justify-content:center}}
.gauge{width:100%;max-width:300px;display:block;overflow:visible}
.gauge.small{max-width:180px;margin:0 auto}
.gauge .trk{fill:none;stroke-width:16;stroke-linecap:butt;opacity:.22}
.gauge .trk.bad{stroke:var(--bad)}.gauge .trk.warn{stroke:var(--warn)}.gauge .trk.good{stroke:var(--good)}
.gauge .fill{fill:none;stroke-width:16;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.gauge .fill.bad{stroke:var(--bad)}.gauge .fill.warn{stroke:var(--warn)}.gauge .fill.good{stroke:var(--good)}
.gauge .needle{transform-origin:120px 118px;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.gauge .knob{fill:var(--sheet);stroke-width:5}
.gauge .knob.bad{stroke:var(--bad)}.gauge .knob.warn{stroke:var(--warn)}.gauge .knob.good{stroke:var(--good)}
.gauge .gnum{font-family:var(--sans);font-weight:800;font-size:52px;fill:var(--ink);text-anchor:middle;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.gauge.small .gnum{font-size:44px}
.gauge .gsub{font-size:12px;fill:var(--muted);text-anchor:middle}
.gauge .gt{font-family:var(--mono);font-size:11px;fill:var(--muted);text-anchor:middle}
.sv{display:flex;flex-direction:column;gap:14px;min-width:0}
.pill.lg{font-family:var(--sans);font-size:1rem;font-weight:800;letter-spacing:0;text-transform:none;padding:6px 14px;align-self:flex-start}
@media (max-width:680px){.pill.lg{align-self:center}}
.bands{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.bands .b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.bands .b.bad::before{background:var(--bad)}.bands .b.warn::before{background:var(--warn)}.bands .b.good::before{background:var(--good)}

/* factor cards */
.sec{display:flex;flex-direction:column;gap:4px}
.factors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.factors{grid-template-columns:1fr}}
.factor{border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px}
.factor .fh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.factor .fv{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.factor .fs{color:var(--muted);font-size:.86rem}
.fbar{height:6px;border-radius:3px;background:var(--faint);overflow:hidden;margin-top:10px}
.fbar i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.fbar i.good{background:var(--good)}.fbar i.warn{background:var(--warn)}.fbar i.bad{background:var(--bad)}
@keyframes grow{from{transform:scaleX(0)}}
.factor .fi{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:4px}
.next{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}

/* screen transitions */
@keyframes vt-out{to{opacity:0;transform:translateY(-10px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(16px)}}
::view-transition-old(root){animation:vt-out .22s ease-in both}
::view-transition-new(root){animation:vt-in .38s cubic-bezier(.2,.8,.2,1) both}
.enter{animation:vt-in .4s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  ::view-transition-old(root),::view-transition-new(root){animation:none}
}

// ThinFile engine: parse -> redact -> sort -> check -> score -> coach.
// Pure functions, no DOM, so the same code runs in the page and in tests.
const ThinFile = (() => {
  // ---------- 1. Parse ----------
  function parseCSV(text) {
    const lines = String(text).replace(/\r/g, "").split("\n").map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) throw new Error("Add a header row and at least one transaction.");
    const split = l => {
      const out = []; let cur = "", q = false;
      for (const ch of l) {
        if (ch === '"') q = !q;
        else if (ch === "," && !q) { out.push(cur); cur = ""; }
        else cur += ch;
      }
      out.push(cur);
      return out.map(s => s.trim());
    };
    const head = split(lines[0]).map(h => h.toLowerCase());
    const col = names => head.findIndex(h => names.includes(h));
    const di = col(["date", "posted", "transaction date"]);
    const si = col(["description", "desc", "memo", "name", "details"]);
    const ai = col(["amount", "amt"]);
    const bi = col(["balance", "running balance"]);
    if (di < 0 || si < 0 || ai < 0) throw new Error("The first row must name the columns: date, description, amount (balance is optional).");
    const rows = [];
    lines.slice(1).forEach((l, n) => {
      const c = split(l);
      const date = normDate(c[di]);
      const amount = Number(String(c[ai]).replace(/[$,\s]/g, ""));
      if (!date || !isFinite(amount)) throw new Error(`Row ${n + 2} has an unreadable date or amount: "${l.slice(0, 60)}"`);
      rows.push({ date, desc: String(c[si] || "").toUpperCase(), amount, balance: bi >= 0 ? Number(c[bi]) : null });
    });
    rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    return rows;
  }
  function normDate(s) {
    s = String(s || "").trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`; }
    return null;
  }

  // ---------- 2. Privacy Guard ----------
  // Removes people's names from person-to-person transfers. The applicant's own
  // name and background are never passed to any later step.
  const P2P = /^(ZELLE (?:TO|FROM)|VENMO (?:TO|FROM)|WISE TRANSFER (?:TO|FROM)|CASH APP (?:TO|FROM)|PAYPAL (?:TO|FROM))\s+(.+?)(\s+RENT)?$/;
  function redact(rows, applicant) {
    let names = 0;
    const words = applicant ? String(applicant.name || "").toUpperCase().split(/\s+/).filter(w => w.length > 1) : [];
    const out = rows.map(r => {
      let desc = r.desc;
      const m = desc.match(P2P);
      if (m) { desc = `${m[1]} •••${m[3] || ""}`; names++; }
      for (const w of words) if (desc.includes(w)) { desc = desc.split(w).join("•••"); names++; }
      return { date: r.date, desc, amount: r.amount, balance: r.balance };
    });
    return { rows: out, names };
  }

  // ---------- 3. Sorter ----------
  const RULES = [
    ["fee", null, /\bNSF\b|OVERDRAFT|RETURNED ITEM|INSUFFICIENT/],
    ["savings", null, /TRANSFER TO SAVINGS|TO SAVINGS|SAVINGS DEPOSIT/],
    ["cash", null, /CASH DEPOSIT|ATM DEPOSIT|BRANCH DEPOSIT|TELLER DEPOSIT/],
    ["income", null, /PAYROLL|DIRECT DEP|STIPEND|SALARY|DASHER PAYOUT|DRIVER .*PAYOUT|INSTACART SHOPPER|GRUBHUB DRIVER/],
    ["transfer_in", null, /^(ZELLE|VENMO|WISE TRANSFER|CASH APP|PAYPAL) FROM/],
    ["rent", "Rent", /\bRENT\b/],
    ["bill", "Electric", /PSEG|CON ?ED|ELECTRIC|UTILITY|NATIONAL GRID|DUKE ENERGY/],
    ["bill", "Phone", /MOBILE|WIRELESS|VERIZON|AT&T|SPRINT/],
    ["bill", "Internet", /INTERNET|OPTIMUM|XFINITY|COMCAST|FIOS|SPECTRUM/],
    ["bill", "Car insurance", /AUTO INS|PROGRESSIVE|GEICO|STATE FARM|ALLSTATE/],
    ["debt", "Car payment", /CAR PMT|AUTO LOAN|TOYOTA FINANCIAL|HONDA FINANCIAL/],
    ["debt", "Car lease", /LEASE/],
    ["debt", "Credit card", /CARD MIN PMT|CREDIT CARD|CARD PAYMENT|AMEX PMT|DISCOVER PMT/],
    ["debt", "Pay later", /AFFIRM|KLARNA|AFTERPAY|PAY LATER/],
    ["debt", "Student loan", /STUDENT LOAN|NAVIENT|NELNET|SALLIE MAE/],
    ["subscription", null, /SPOTIFY|NETFLIX|HULU|APPLE\.COM|EQUINOX|PLANET FITNESS|YOUTUBE/],
    ["spending", null, /TRADER JOE|SHOPRITE|WHOLE FOODS|TARGET|AMAZON|WALMART|UBER EATS|DOORDASH(?! DASHER)|GRUBHUB(?! DRIVER)|CHIPOTLE|SHELL|EXXON|BP |NJ TRANSIT|MTA|NOBU|SEPHORA|AIRBNB|TICKETMASTER|LOUNGE|VENMO PAYMENT|UBER TRIP|LYFT|STARBUCKS|POPEYES|MCDONALD|PATEL BROTHERS|GROCERY|CVS|WALGREENS/],
  ];
  const CATS = ["income", "cash", "transfer_in", "rent", "bill", "debt", "subscription", "spending", "savings", "fee"];
  function merchantKey(desc) {
    return desc.replace(/[#*]/g, " ").replace(/\d+/g, " ").replace(/\s+/g, " ").trim().split(" ").slice(0, 3).join(" ");
  }
  function sortRules(rows) {
    const unknown = new Map();
    const sorted = rows.map(r => {
      for (const [cat, label, re] of RULES) if (re.test(r.desc)) return { ...r, cat, label, by: "rules" };
      const key = merchantKey(r.desc);
      unknown.set(key, r.amount);
      return { ...r, cat: null, label: null, key, by: null };
    });
    return { sorted, unknown: [...unknown.entries()].map(([key, amount]) => ({ key, amount })) };
  }
  // aiMap: { [merchantKey]: {cat, label} } from the AI Sorter; anything missing becomes spending.
  function applySort(sorted, aiMap) {
    return sorted.map(r => {
      if (r.cat) return r;
      const hit = aiMap && aiMap[r.key];
      if (hit && CATS.includes(hit.cat)) {
        const label = ["bill", "debt", "rent"].includes(hit.cat) ? (hit.label || r.key) : null;
        return { ...r, cat: hit.cat, label, by: "ai" };
      }
      return { ...r, cat: r.amount > 0 ? "transfer_in" : "spending", label: null, by: "default" };
    });
  }

  // ---------- 4. Checker ----------
  const ym = d => d.slice(0, 7);
  function monthRange(a, b) {
    const out = []; let [y, m] = a.split("-").map(Number); const [by, bm] = b.split("-").map(Number);
    while (y < by || (y === by && m <= bm)) { out.push(`${y}-${String(m).padStart(2, "0")}`); m++; if (m > 12) { m = 1; y++; } }
    return out;
  }
  // declareCash: the applicant has said their cash deposits are earnings. Only then do
  // they count as income; they stay labeled as declared, never as verified pay.
  function check(rows, { declareCash = false } = {}) {
    const first = rows[0].date, last = rows[rows.length - 1].date;
    const months = monthRange(ym(first), ym(last));
    // Recurring payments: rent, bills and debts seen in 3+ different months.
    const groups = {};
    for (const r of rows) if (["rent", "bill", "debt"].includes(r.cat) && r.amount < 0) (groups[r.label] ||= []).push(r);
    const wall = {}, detail = {}, dueDay = {};
    for (const [label, list] of Object.entries(groups)) {
      const byMonth = {};
      for (const r of list) (byMonth[ym(r.date)] ||= []).push(r);
      if (Object.keys(byMonth).length < 3) continue;
      const firstPay = mo => byMonth[mo].reduce((a, b) => (a.date <= b.date ? a : b));
      const days = Object.keys(byMonth).map(mo => Number(firstPay(mo).date.slice(8)));
      const freq = {}; days.forEach(d => freq[d] = (freq[d] || 0) + 1);
      const due = Number(Object.entries(freq).sort((a, b) => b[1] - a[1] || a[0] - b[0])[0][0]);
      const start = ym(list[0].date);
      dueDay[label] = due;
      detail[label] = [];
      wall[label] = months.map((mo, i) => {
        if (mo < start) { detail[label].push(null); return "none"; }
        if (byMonth[mo]) {
          const p = firstPay(mo), late = Number(p.date.slice(8)) - due;
          detail[label].push({ date: p.date, amount: -p.amount, late });
          return late <= 3 ? "g" : "y";
        }
        detail[label].push(null);
        // The last month may be incomplete: only call it missed once the due day has passed.
        if (i === months.length - 1 && Number(last.slice(8)) < due + 4) return "none";
        return "r";
      });
    }
    // Monthly income and spending (savings transfers are not spending).
    const inc = {}, out = {};
    months.forEach(m => { inc[m] = 0; out[m] = 0; });
    let cashTotal = 0;
    for (const r of rows) {
      if (r.cat === "cash" && r.amount > 0) { cashTotal += r.amount; if (declareCash) inc[ym(r.date)] += r.amount; }
      else if (r.cat === "income") inc[ym(r.date)] += r.amount;
      else if (r.amount < 0 && r.cat !== "savings") out[ym(r.date)] -= r.amount;
    }
    const cutoff = new Date(new Date(last).getTime() - 90 * 864e5).toISOString().slice(0, 10);
    const overdrafts90 = rows.filter(r => r.cat === "fee" && r.date > cutoff).length;
    const cells = Object.values(wall).flat().filter(s => s !== "none");
    const rate = arr => arr.length ? arr.filter(s => s === "g").length / arr.length : null;
    const billCells = Object.entries(wall).filter(([k]) => k !== "Rent").flatMap(([, v]) => v).filter(s => s !== "none");
    const income = months.map(m => inc[m]);
    const spend = months.map(m => out[m]);
    const paidMonths = months.filter(m => inc[m] > 0);
    const mean = paidMonths.length ? paidMonths.reduce((a, m) => a + inc[m], 0) / paidMonths.length : 0;
    const sd = paidMonths.length ? Math.sqrt(paidMonths.reduce((a, m) => a + (inc[m] - mean) ** 2, 0) / paidMonths.length) : 0;
    const left = paidMonths.length ? paidMonths.reduce((a, m) => a + (inc[m] - out[m]) / inc[m], 0) / paidMonths.length : -1;
    const rentRow = wall.Rent ? wall.Rent.filter(s => s !== "none") : [];
    return {
      months, wall, detail, dueDay, income, spend, overdrafts90,
      onTime: rate(cells) ?? 0, rentOn: rate(rentRow), billsOn: rate(billCells),
      late: cells.filter(s => s === "y").length, missed: cells.filter(s => s === "r").length,
      payments: cells.length, mean, cv: mean ? sd / mean : 1, left,
      rentStreak: (() => { let n = 0; for (let i = rentRow.length - 1; i >= 0 && rentRow[i] === "g"; i--) n++; return n; })(),
      rentAmount: groups.Rent ? Math.round(-groups.Rent[groups.Rent.length - 1].amount) : null,
      cashTotal, cashMonthly: cashTotal / months.length, declareCash,
      first, last,
    };
  }

  // ---------- 5. Calculator ----------
  // Fixed weights in plain code. Same history in, same score out.
  const clamp = x => Math.max(0, Math.min(1, x));
  function score(m) {
    const factors = [
      { key: "onTime", name: "On-time payments", max: 40, pts: 40 * clamp((m.onTime - 0.6) / 0.4) },
      { key: "income", name: "Steady income", max: 25, pts: 25 * clamp(1 - (m.cv - 0.1) / 0.5) },
      { key: "left", name: "Money left over", max: 20, pts: 20 * clamp((m.left + 0.1) / 0.45) },
      { key: "od", name: "No overdrafts", max: 15, pts: 15 * clamp(1 - m.overdrafts90 / 3) },
    ];
    const total = Math.round(factors.reduce((a, f) => a + f.pts, 0));
    return { factors, total, band: total >= 75 ? "good" : total >= 50 ? "warn" : "bad" };
  }

  // ---------- 6. Coach ----------
  // Searches for the smallest set of realistic changes that reaches 75.
  const MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  function addDays(iso, n) {
    const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
    return `${MONTHS_LONG[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;
  }
  // Dates count from the last transaction in the history, so the plan is concrete.
  function coach(m) {
    const now = score(m);
    if (now.total >= 75) return { needed: false, steps: [], final: now.total, reviewDate: null };
    const in60 = addDays(m.last, 60), in90 = addDays(m.last, 90);
    const moves = [
      { key: "od", days: 60, say: `No overdrafts until ${in60}`, apply: x => ({ ...x, overdrafts90: 0 }) },
      { key: "left", days: 90, say: `Spend less than you earn until ${in90}, keeping about 15% left over each month`, apply: x => ({ ...x, left: Math.max(x.left, 0.15) }) },
      { key: "onTime", days: 90, say: `Pay every bill on or before its due date until ${in90}`, apply: x => ({ ...x, onTime: Math.max(x.onTime, 0.97) }) },
    ];
    let cur = m; const steps = []; const used = new Set();
    while (score(cur).total < 75 && used.size < moves.length) {
      const best = moves.filter(mv => !used.has(mv.key))
        .map(mv => ({ mv, gain: score(mv.apply(cur)).total - score(cur).total }))
        .sort((a, b) => b.gain - a.gain)[0];
      if (!best || best.gain <= 0) break;
      used.add(best.mv.key); cur = best.mv.apply(cur);
      steps.push({ key: best.mv.key, days: best.mv.days, say: best.mv.say, gain: best.gain, after: score(cur).total });
    }
    const days = Math.max(0, ...steps.map(s => s.days));
    return { needed: true, steps, final: score(cur).total, reviewDate: days ? addDays(m.last, days) : null };
  }

  // ---------- Report ID ----------
  // A fingerprint of exactly what the agents saw (the redacted rows). Two people with
  // the same history get the same ID, whatever their names.
  function fingerprint(rows) {
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    const s = rows.map(r => `${r.date}|${r.desc}|${r.amount}`).join("\n");
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
      h2 = Math.imul(h2 ^ c, 2246822519) >>> 0;
    }
    return "TF-" + (h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0")).slice(0, 10).toUpperCase();
  }

  return { parseCSV, redact, sortRules, applySort, check, score, coach, fingerprint, merchantKey, CATS };
})();

const samplePromise=(async()=>{try{return await window.claude?.use?.("sample")}catch{return null}})();

let aiOff=false;
const OFF=["not_granted","sampling_disabled","not_declared","capability_disabled"];

async function aiSort(unknown){
  const sample=await getSample();
  if(!sample||aiOff||!unknown.length)return {map:{},used:false};
  const list=unknown.slice(0,60).map(u=>`${u.key} | ${u.amount>0?"money in":"money out"}`).join("\n");
  try{
    const res=await sample.json(
`You label bank transactions for a credit-reliability check. For each merchant below, pick one category:
income (wages or gig pay), transfer_in (money from a person), rent, bill (utilities, phone, internet, insurance), debt (loan, card, lease, buy-now-pay-later), subscription, spending (everyday purchases), savings, fee (bank fees).
For rent, bill and debt also give a short human label like "Renters insurance" or "Gym loan".
Reply with only a JSON object mapping each merchant exactly as written to {"cat": string, "label": string|null}.

${list}`,{modelTier:"quick"});
    return {map:res&&typeof res==="object"?res:{},used:true};
  }catch(e){if(OFF.includes(e.code))aiOff=true;return {map:{},used:false}}
}

async function aiCoach(m,sc,plan){
  const sample=await getSample();
  if(!sample||aiOff)return null;
  const facts={verdict:VERDICT[sc.band],score:sc.total,months_of_history:m.months.length,recurring_payments:Object.keys(m.wall),
    on_time_rate:pct(m.onTime),late_payments:m.late,missed_payments:m.missed,rent_on_time_streak_months:m.rentStreak,
    average_monthly_income:money(m.mean),income_varies_by:pct(m.cv),share_of_income_left_over:pct(m.left),overdraft_fees_last_90_days:m.overdrafts90,
    computed_fix_plan:plan.steps.map(s=>`${s.say} (score becomes ${s.after})`)};
  try{
    const r=await sample.json(
`You are the Coach in ThinFile, an app that turns bank history into proof someone pays on time. The score and verdict below were computed by fixed code; do not change them.
Write in plain, warm, direct English. No jargon (never say DTI, NSF, underwriting, FICO). No names, no assumptions about background.
Reply with only JSON: {"lender": one factual sentence a lender reads first (max 25 words), "applicant": 2 short sentences explaining the result to the applicant, "tip": one concrete habit tip that supports the fix plan, or null if no fix is needed}.

Facts: ${JSON.stringify(facts)}`,{modelTier:"quick"});
    return r&&typeof r.lender==="string"?r:null;
  }catch(e){if(OFF.includes(e.code))aiOff=true;return null}
}

function ruleSentence(m){
  const parts=[];
  if(m.rentAmount&&m.rentStreak>=6)parts.push(`Paid ${money(m.rentAmount)} rent on time for ${m.rentStreak} straight months.`);
  else if(m.rentOn!=null)parts.push(`Rent paid on time in ${pct(m.rentOn)} of months.`);
  if(m.left<0)parts.push("Spending has been higher than income on average.");
  parts.push(m.overdrafts90===0?"Never overdrawn in the last 90 days.":`${m.overdrafts90} overdraft fee${m.overdrafts90>1?"s":""} in the last 90 days.`);
  return parts.join(" ");
}

function pipeline(raw,applicant,aiMap,declareCash=false){
  const red=T.redact(raw,applicant);
  const sorted=T.applySort(T.sortRules(red.rows).sorted,aiMap);
  const m=T.check(sorted,{declareCash});
  return {red,sorted,m,sc:T.score(m),id:T.fingerprint(red.rows)};
}

const monHead=(m,i)=>MON[Number(m.slice(5))-1]+"<br>"+(i===0||m.slice(5)==="01"?"'"+m.slice(2,4):"&nbsp;");
function wall(m,{maxMonths,interactive=true}={}){
  const start=maxMonths?Math.max(0,m.months.length-maxMonths):0;
  const months=m.months.slice(start);
  const lw=Math.max(40,...Object.keys(m.wall).map(k=>k.length*8.2+14));
  const cols=`grid-template-columns:${Math.round(lw)}px repeat(${months.length},minmax(22px,1fr))`;
  return `<div class="wallbox"><div class="wall" style="min-width:${Math.round(lw)+months.length*24}px">
  <div class="r" style="${cols}"><span></span>${months.map((x,i)=>`<span class="m">${monHead(x,i)}</span>`).join("")}</div>
  ${Object.entries(m.wall).map(([k,v],ri)=>`<div class="r" style="${cols}"><span class="lbl">${esc(k)}</span>${v.slice(start).map((s,i)=>{
    const delay=`style="animation-delay:${reduce?0:i*28+ri*60}ms"`;
    if(!interactive||s==="none")return `<span class="dot ${s}" ${delay}></span>`;
    return `<button class="dot ${s}" data-l="${esc(k)}" data-i="${i+start}" aria-label="${esc(k)}, ${MON[Number(months[i].slice(5))-1]} ${months[i].slice(0,4)}: ${{g:"on time",y:"late",r:"missed"}[s]}" ${delay}></button>`}).join("")}</div>`).join("")}
  </div></div>`;
}

function start(csv,applicant,key){go(()=>checking(applicant));run(csv,applicant,key)}
function checking(applicant){
  const who=applicant.name?applicant.name.split(" ")[0]+"'s":"your";

const stepEl=i=>document.getElementById("st"+i);
function step(i,msg,done=true){const li=stepEl(i);if(!li)return;li.className=done?"on":"run";li.querySelector("small").textContent=msg}

// Streams real transactions onto the tape. Returns the row elements so later steps can label them.
async function feed(rows,n){
  const tape=document.getElementById("tape");if(!tape)return [];
  const pick=rows.slice(-n);const els=[];
  for(const r of pick){
    const el=document.createElement("div");el.className="tx";
    el.innerHTML=`<span class="d">${r.date.slice(5)}</span><span class="s">${esc(r.desc)}</span><span class="a">${r.amount.toFixed(2)}</span><span class="c">···</span>`;
    tape.prepend(el);els.unshift({el,r});
    if(tape.children.length>16)tape.lastChild.remove();
    await sleep(55);
  }
  return els;
}

async function run(csv,applicant,key){
  await sleep(380);
  try{
    const raw=T.parseCSV(csv);
    const cnt=document.getElementById("ck-count");if(cnt)cnt.textContent=`${raw.length} transactions`;
    step(0,"Reading transactions",false);
    const els=await feed(raw,16);
    const red=T.redact(raw,applicant);
    // show redaction on the tape
    els.forEach(({el,r})=>{const i=raw.indexOf(r),d=red.rows[i].desc;if(d!==r.desc){const s=el.querySelector(".s");s.textContent=d;s.classList.add("hid")}});
    await sleep(350);
    step(0,`Hid ${red.names} name${red.names===1?"":"s"}. Your name and country are never passed on.`);

    step(1,"Sorting with rules",false);
    const s=T.sortRules(red.rows);
    let ai={map:{},used:false};
    if(s.unknown.length){step(1,`Rules know most of these. Asking Claude about ${s.unknown.length} unfamiliar merchant${s.unknown.length>1?"s":""}`,false);ai=await aiSort(s.unknown)}
    const sorted=T.applySort(s.sorted,ai.map);
    for(const {el,r} of els){const sr=sorted[raw.indexOf(r)];const c=el.querySelector(".c");c.textContent=sr.label||CAT[sr.cat];c.className="c set "+sr.cat;await sleep(40)}
    const byAI=sorted.filter(r=>r.by==="ai").length;
    step(1,`${sorted.filter(r=>r.by==="rules").length} sorted by rules`+(ai.used?`, ${byAI} by Claude`:s.unknown.length?`, ${s.unknown.length} unfamiliar merchant${s.unknown.length>1?"s":""} counted as spending (AI off)`:""));

    step(2,"Looking for payments that repeat every month",false);await sleep(500);
    const m=T.check(sorted);
    step(2,`${Object.keys(m.wall).length} recurring payments over ${m.months.length} months · ${pct(m.onTime)} on time · ${m.overdrafts90} overdraft fee${m.overdrafts90===1?"":"s"} in 90 days`);

    step(3,"Scoring",false);await sleep(450);
    const sc=T.score(m);
    step(3,`Reliability Score ${sc.total} of 100`);

    const plan=T.coach(m);
    step(4,plan.needed?"Finding the fastest path to approval":"Writing the summary",false);
    const note=await aiCoach(m,sc,plan);
    step(4,(plan.needed?`${plan.steps.length} change${plan.steps.length>1?"s":""} gets you to ${plan.final}`:"No changes needed")+(note?" · summary by Claude":" · summary from rules (AI off)"));
    await sleep(600);
    state={raw,applicant,key,aiMap:ai.map,sorted,m,sc,plan,note,red,id:T.fingerprint(red.rows),declareCash:false,taxDoc:null};
    if(key)history.replaceState(null,"","#"+key);
    go(()=>report(false));
  }catch(e){
    const box=document.querySelector(".sheet");
    if(box)box.insertAdjacentHTML("beforeend",`<p class="err">${esc(e.message||"Something went wrong reading that file.")}</p><div><button class="btn" id="bk">Go back</button></div>`);
    const bk=document.getElementById("bk");if(bk)bk.onclick=()=>go(home);
  }
}

// Score dial, like a credit-score meter: 0 to 100 across a half circle,
// with the three verdict bands marked on the track.
function gauge(score,band,{small=false}={}){
  const cx=120,cy=118,r=96;
  const pt=s=>{const a=Math.PI*(1-s/100);return [cx+r*Math.cos(a),cy-r*Math.sin(a)]};
  const arc=(a,b)=>{const [x1,y1]=pt(a),[x2,y2]=pt(b);return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`};
  const tick=s=>{const a=Math.PI*(1-s/100),i=r-12,o=r+12;return `<line x1="${(cx+i*Math.cos(a)).toFixed(1)}" y1="${(cy-i*Math.sin(a)).toFixed(1)}" x2="${(cx+o*Math.cos(a)).toFixed(1)}" y2="${(cy-o*Math.sin(a)).toFixed(1)}" stroke="var(--sheet)" stroke-width="3"/>`};
  const [mx,my]=pt(0);
  return `<svg class="gauge ${small?"small":""}" viewBox="0 0 240 150" role="img" aria-label="Reliability score ${score} out of 100: ${VERDICT[band]}">
    <path d="${arc(0,49.5)}" class="trk bad"/><path d="${arc(50.5,74.5)}" class="trk warn"/><path d="${arc(75.5,100)}" class="trk good"/>
    <path d="${arc(0,Math.max(.5,score))}" class="fill ${band}" pathLength="1" ${small?'style="stroke-dashoffset:0"':""}/>
    ${tick(50)}${tick(75)}
    <g class="needle" data-rot="${(score*1.8).toFixed(1)}" ${small?`style="transform:rotate(${(score*1.8).toFixed(1)}deg)"`:""}><circle cx="${mx}" cy="${my}" r="9" class="knob ${band}"/></g>
    ${small?"":`<text x="${pt(0)[0]}" y="${cy+26}" class="gt">0</text><text x="${pt(100)[0]}" y="${cy+26}" class="gt">100</text>`}
    <text x="${cx}" y="${cy-14}" class="gnum">${small?score:`<tspan class="count">0</tspan>`}</text>
    <text x="${cx}" y="${cy+12}" class="gsub">out of 100</text>
  </svg>`;
}
function animateGauges(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    app.querySelectorAll(".gauge .needle").forEach(g=>g.style.transform=`rotate(${g.dataset.rot}deg)`);
    app.querySelectorAll(".gauge .fill").forEach(p=>p.style.strokeDashoffset="0");
  }));
}
const RATING=f=>{const r=f.pts/f.max;return r>=.9?["Excellent","good"]:r>=.7?["Good","good"]:r>=.4?["Fair","warn"]:["Needs work","bad"]};
const IMPACT={onTime:"High impact",income:"Medium impact",left:"Medium impact",od:"Lower impact"};
function factorCards(m,sc){
  const val={
    onTime:[pct(m.onTime),`${m.payments} payments · ${m.late} late · ${m.missed} missed`],
    income:[money(m.mean),`a month on average · varies about ${pct(m.cv)}`],
    left:[m.left<0?"−"+pct(-m.left):pct(m.left),"of income left over each month"],
    od:[String(m.overdrafts90),`overdraft fee${m.overdrafts90===1?"":"s"} in the last 90 days`],
  };
  return `<div class="factors">${sc.factors.map((f,i)=>{const [rt,cls]=RATING(f);return `<div class="factor">
    <div class="fh"><span>${f.name}</span><span class="pill ${cls}">${rt}</span></div>
    <div class="fv">${val[f.key][0]}</div><div class="fs">${val[f.key][1]}</div>
    <div class="fbar"><i class="${cls}" style="width:${(f.pts/f.max*100).toFixed(0)}%;animation-delay:${400+i*90}ms"></i></div>
    <div class="fi"><span>${IMPACT[f.key]}</span><span class="mono">${f.pts.toFixed(1)} / ${f.max} pts</span></div></div>`}).join("")}</div>`;
}
function scoreCard(sc,summary){
  return `<div class="scorecard">${gauge(sc.total,sc.band)}
    <div class="sv"><span class="pill ${sc.band} lg">${VERDICT[sc.band]}</span>
    <p class="bands"><span class="b bad">0–49 Not ready</span><span class="b warn">50–74 Not yet</span><span class="b good">75–100 Reliable payer</span></p>
    ${summary}</div></div>`;
}
function countUp(to){
  const el=app.querySelector(".gauge .count");if(!el)return;
  if(reduce){el.textContent=to;return}
  const t0=performance.now(),dur=1100;
  const tick=t=>{const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}
function figs(m){
  return `<div class="figs"><div><strong>${pct(m.rentOn)}</strong><span>rent on time</span></div>
  <div><strong>${pct(m.billsOn)}</strong><span>bills on time</span></div>
  <div><strong>${m.months.length}</strong><span>months of history</span></div>
  <div><strong>${Object.keys(m.wall).length}</strong><span>recurring payments</span></div></div>`;
}
const period=m=>`${MON[Number(m.months[0].slice(5))-1]} ${m.months[0].slice(0,4)} – ${MON[Number(m.months.at(-1).slice(5))-1]} ${m.months.at(-1).slice(0,4)}`;

function how(){
  const {sc,sorted,red}=state;
  return `<details><summary>How we decided</summary>
  <div style="display:flex;flex-direction:column;gap:12px">
  <p class="muted">The score uses fixed weights in code: on-time payments 40, steady income 25, money left over 20, no overdrafts 15. 75 or more is a Reliable payer, 50 to 74 is Not yet. The Privacy Guard hid ${red.names} name${red.names===1?"":"s"} before any other step ran. Claude only labels unfamiliar merchants and writes the summary; it never sets the score.</p>
  <div class="label">What the Sorter saw · latest 40</div>
  <div class="tbl"><table><thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Label</th><th>By</th></tr></thead><tbody>
  ${sorted.slice(-40).reverse().map(r=>`<tr><td>${r.date}</td><td>${esc(r.desc)}</td><td class="amt">${r.amount.toFixed(2)}</td><td>${esc(r.label||CAT[r.cat])}</td><td><span class="by ${r.by==="ai"?"ai":""}">${r.by==="ai"?"Claude":r.by}</span></td></tr>`).join("")}
  </tbody></table></div></div></details>`;
}

function lenderNotes(){
  const {m,sc,plan,declareCash,taxDoc}=state;
  const items=[];
  if(m.cashTotal)items.push(declareCash
    ?`Income includes <b>${money(m.cashMonthly)}/mo declared cash</b>, marked by the applicant. ${taxDoc?`Tax return attached: ${esc(taxDoc)}.`:"No tax return attached."}`
    :`${money(m.cashMonthly)}/mo in cash deposits, <b>not counted</b> as income.`);
  if(sc.band==="warn"&&plan.reviewDate)items.push(`Suggested: a smaller starter offer now, with a review on <b>${plan.reviewDate}</b> if the plan below is met.`);
  if(plan.needed)items.push(`Applicant's plan: ${plan.steps.map(s=>esc(s.say)).join("; ")}.`);
  items.push("ThinFile shows payment history only. The lender runs its own identity checks and makes the decision.");
  return `<div class="notes"><span class="label">Notes for the lender</span><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
}

function report(lender){
  const {m,sc,plan,note,applicant,key,id}=state;
  const who=applicant.name?applicant.name.split(" ")[0]+"'s":"Your";
  const summary=(note?`<div><span class="byline">Summary · written by Claude</span><p class="summary">${esc(note.lender)}</p></div>`:`<p class="summary">${esc(ruleSentence(m))}</p>`)
    +(!lender&&note&&note.applicant?`<p class="muted">${esc(note.applicant)}</p>`:"");
  const head=`<div class="sheet-head"><span class="label">${lender?"Shared reliability report":esc(who)+" reliability report"}</span><span class="label">${period(m)} · ID <b>${id}</b></span></div>`;
  const legend=`<div class="legend"><span style="--c:var(--good)">On time</span><span style="--c:var(--warn)">Late</span><span style="--c:var(--bad)">Missed</span><span class="tipnote">Tap a dot to see the payment</span></div>`;
  const factors=`<div class="sheet"><div class="sec"><h2>What shaped the score</h2><p class="muted">Four factors with fixed weights. Same history, same score, every time.</p></div>${factorCards(m,sc)}</div>`;
  const history=`<div class="sheet"><div class="sec"><h2>Payment history</h2><p class="muted">One dot per bill per month, found in the bank history.</p></div>${wall(m)}${legend}${figs(m)}</div>`;
  if(lender){
    app.innerHTML=`${bar()}<div><button class="link" id="bk">← Back to ${esc(who==="Your"?"your":who)} report</button></div>
    <div class="sheet"><span class="shared">Shared copy</span>${head}${scoreCard(sc,summary)}${lenderNotes()}
    <div class="verdict-line good">${SHIELD}Fair check passed. Name and background were hidden during review.</div></div>
    ${factors}${history}
    <div class="sheet">${how()}<p class="label">Report ${id} covers ${state.raw.length} transactions, ${period(m)}.</p></div>${foot}`;
    wireHome();document.getElementById("bk").onclick=()=>go(()=>report(false));
    wireWall(m);animateGauges();countUp(sc.total);
    if(key)history.replaceState(null,"","#lender-"+key);
    return;
  }
  const action=!plan.needed
    ?`<div class="next"><div><h3>You're ready to share</h3><p class="muted">Your history already shows you pay on time. Send this report to a lender or landlord.</p></div><button class="btn primary" id="share">Share my report →</button></div>`
    :`<div class="plan"><div><h3>Your fastest path to approval</h3>
      <ol>${plan.steps.map(s=>`<li>${esc(s.say)} <b>→ ${s.after}</b></li>`).join("")}</ol>
      <p class="muted" style="margin-top:10px">${plan.final>=75?`Do this and you'll be a Reliable payer by <b>${plan.reviewDate}</b>.`:`That gets you to ${plan.final}. Keep it up another quarter to reach 75.`}${sc.band==="warn"?" Until then, lenders may offer a smaller starter limit.":""}</p>
      ${note&&note.tip?`<div style="margin-top:12px"><span class="byline">Tip · Claude</span><p>${esc(note.tip)}</p></div>`:""}
      <button class="btn" id="share" style="margin-top:14px">See what a lender sees →</button></div>
      ${whatIf(m)}</div>`;
  app.innerHTML=`${bar()}<div><button class="link" id="bk">← All files</button></div>
  <div class="sheet">${head}${scoreCard(sc,summary)}</div>
  <div class="sheet"><div class="sec"><h2>${plan.needed?"Next steps":"Next step"}</h2></div>${cashBox()}${action}</div>
  ${factors}${history}
  <div class="sheet"><div class="row" style="justify-content:space-between"><div class="sec"><h2>Fair check</h2><p class="muted" style="max-width:34em">Run this exact bank history under five other identities. If ThinFile is fair, every score and every report ID matches.</p></div><button class="btn" id="prove">Run fair check</button></div><div id="twins"></div></div>
  <div class="sheet">${how()}</div>${foot}`;
  wireHome();
  document.getElementById("bk").onclick=()=>go(home);
  const sh=document.getElementById("share");if(sh)sh.onclick=()=>go(()=>report(true));
  document.getElementById("prove").onclick=prove;
  wireWall(m);animateGauges();countUp(sc.total);wireCash();
  if(plan.needed)wireWhatIf(m);
}

// ---------- Declared cash income ----------
// Cash deposits never count by default. The applicant can declare them as earnings;
// they then count as income but stay labeled as declared on every view.
function cashBox(){
  const {m,declareCash,taxDoc}=state;
  if(!m.cashTotal)return "";
  const doc=`<div class="row" style="gap:8px"><label class="btn" for="tax-file">${taxDoc?"Replace tax return":"Attach tax return (optional)"}</label><input type="file" id="tax-file" accept=".pdf,.jpg,.jpeg,.png" hidden>
    ${taxDoc?`<span class="mono" style="font-size:.8rem">Attached: ${esc(taxDoc)}</span>`:`<span class="muted" style="font-size:.85rem">Backs up your cash income for the lender.</span>`}</div>`;
  return `<div class="cashbox ${declareCash?"on":""}">
    <div><span class="label">Cash deposits found</span>
    <p style="margin-top:4px">${declareCash
      ?`Counting <b class="mono">${money(m.cashMonthly)}/mo</b> in cash as <b>declared income</b>. Lenders see it marked as declared by you, separate from verified pay.`
      :`We found <b class="mono">${money(m.cashMonthly)}/mo</b> in cash deposits. They don't count as income unless you say so. If they're earnings, like tips, declare them.`}</p></div>
    <div class="row"><button class="btn ${declareCash?"":"primary"}" id="declare">${declareCash?"Stop counting cash":"Count as declared income"}</button></div>
    ${declareCash?doc:""}</div>`;
}
function wireCash(){
  const b=document.getElementById("declare");
  if(b)b.onclick=()=>{
    state.declareCash=!state.declareCash;
    state.m=T.check(state.sorted,{declareCash:state.declareCash});
    state.sc=T.score(state.m);state.plan=T.coach(state.m);
    state.note=null; // the AI summary described the old numbers
    go(()=>report(false));
  };
  const f=document.getElementById("tax-file");
  if(f)f.onchange=e=>{const x=e.target.files[0];if(!x)return;state.taxDoc=x.name;go(()=>report(false))};
}

// ---------- What-if ----------
function whatIf(m){
  return `<div class="whatif" id="wi"><div class="res"><div><div class="label">What if…</div><p class="muted" style="font-size:.85rem">Drag to see how habits move the score.</p></div><span class="pill ${state.sc.band}" id="wi-pill">${VERDICT[state.sc.band]}</span></div><div id="wi-g">${gauge(state.sc.total,state.sc.band,{small:true})}</div>
  <div class="slider"><label for="wi-od">Overdrafts in 90 days</label><output id="wi-od-o">${m.overdrafts90}</output><input type="range" id="wi-od" min="0" max="${Math.max(3,m.overdrafts90)}" step="1" value="${m.overdrafts90}"></div>
  <div class="slider"><label for="wi-left">Money left over each month</label><output id="wi-left-o">${pct(m.left)}</output><input type="range" id="wi-left" min="-30" max="40" step="1" value="${Math.round(m.left*100)}"></div>
  <div class="slider"><label for="wi-on">Bills paid on time</label><output id="wi-on-o">${pct(m.onTime)}</output><input type="range" id="wi-on" min="60" max="100" step="1" value="${Math.round(m.onTime*100)}"></div></div>`;
}
function wireWhatIf(m){
  const od=document.getElementById("wi-od"),lf=document.getElementById("wi-left"),on=document.getElementById("wi-on");
  const upd=()=>{
    const sim=T.score({...m,overdrafts90:Number(od.value),left:Number(lf.value)/100,onTime:Number(on.value)/100});
    document.getElementById("wi-od-o").textContent=od.value;
    document.getElementById("wi-left-o").textContent=lf.value+"%";
    document.getElementById("wi-on-o").textContent=on.value+"%";
    document.getElementById("wi-g").innerHTML=gauge(sim.total,sim.band,{small:true});
    const p=document.getElementById("wi-pill");p.className="pill "+sim.band;p.textContent=VERDICT[sim.band];
  };
  [od,lf,on].forEach(x=>x.addEventListener("input",upd));
}

// ---------- Fair check ----------
// Re-runs the whole pipeline with a different identity: the applicant name is swapped,
// and so is any family name inside transfer descriptions.
async function prove(){
  const {raw,applicant,aiMap,sc,id}=state;
  const btn=document.getElementById("prove");btn.disabled=true;btn.textContent="Running…";
  const last=(applicant.name||"").split(" ").slice(-1)[0].toUpperCase();
  const people=[[applicant.name||"You",applicant.from||"—"],...TWINS];
  const box=document.getElementById("twins");box.innerHTML=`<div class="twins" id="tw"></div>`;
  const tw=document.getElementById("tw");let same=true;
  for(const [i,[nm,fr]] of people.entries()){
    const twinLast=nm.split(" ").slice(-1)[0].toUpperCase();
    const swapped=i===0||!last?raw:raw.map(r=>({...r,desc:r.desc.split(last).join(twinLast)}));
    const out=pipeline(swapped,{name:nm,from:fr},aiMap,state.declareCash);
    if(out.sc.total!==sc.total||out.id!==id)same=false;
    tw.insertAdjacentHTML("beforeend",`<div class="twin"><span>${esc(nm)} <span class="muted">· ${esc(fr)}</span></span><span class="id">${out.id}</span><span class="s">${out.sc.total}</span><span class="pill ${out.sc.band}">${VERDICT[out.sc.band]}</span></div>`);
    await sleep(160);
  }
  box.insertAdjacentHTML("beforeend",`<div class="verdict-line ${same?"good":"warn"}" style="margin-top:14px">${SHIELD}${same?"Same history, same score, same report ID. The agents never saw who you are.":"Results differ. Something in the data revealed identity."}</div>`);
  btn.disabled=false;btn.textContent="Run again";
}

// ---------- Boot ----------
const h=location.hash.replace("#",""),k=h.replace(/^lender-/,"");
if(SAMPLES[k]){const p=SAMPLES[k];checking({name:p.name});run(p.csv,{name:p.name,from:p.from},k).then(()=>{if(h.startsWith("lender-")&&state.key===k)report(true)})}
else home();
</script>
